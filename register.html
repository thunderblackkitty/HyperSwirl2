<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <link rel="icon" type="image/png" href="logo.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | HyperSwirl</title>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/remixicon/4.6.0/remixicon.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="auth-page">
    <div class="auth-top">
        <a href="index.html" class="auth-logo">
            <img src="logo.png" alt="HyperSwirl Logo">
            <span>Hyper<span>Swirl</span></span>
        </a>

        <button class="action-btn" id="theme-toggle" type="button" aria-label="Switch to dark mode" title="Toggle light and dark mode">
            <i class="ri-moon-line" id="theme-icon" aria-hidden="true"></i>
          </button>
    </div>

    <div class="auth-container">

        <div class="auth-card">

            <a href="index.html" class="back-home">
                <i class="ri-arrow-left-line"></i> Back to Home
            </a>

            <div class="auth-heading">
                <div class="auth-icon">
                    <i class="ri-user-add-line"></i>
                </div>

                <span class="auth-label">JOIN HYPERSWIRL</span>

                <h1>Create your account.</h1>

                <p>
                    Join HyperSwirl and explore useful information
                    about cyclone awareness and preparedness.
                </p>
            </div>

            <form id="register-form">

                <div class="auth-group">
                    <label for="register-name">Full Name</label>

                    <div class="auth-input">
                        <i class="ri-user-line"></i>
                        <input type="text" id="register-name"
                               placeholder="Enter your name"
                               autocomplete="name" required>
                    </div>
                </div>

                <div class="auth-group">
                    <label for="register-email">Email Address</label>

                    <div class="auth-input">
                        <i class="ri-mail-line"></i>
                        <input type="email" id="register-email"
                               placeholder="Enter your email"
                               autocomplete="email" required>
                    </div>
                </div>

                <div class="auth-group">
                    <label for="register-password">Password</label>

                    <div class="auth-input">
                        <i class="ri-lock-line"></i>
                        <input type="password" id="register-password"
                               placeholder="Create a password"
                               autocomplete="new-password"
                               minlength="8" required>

                        <button type="button" class="password-toggle"
                                aria-label="Show password"
                                data-target="register-password">
                            <i class="ri-eye-line"></i>
                        </button>
                    </div>
                </div>

                <div class="auth-group">
                    <label for="confirm-password">Confirm Password</label>

                    <div class="auth-input">
                        <i class="ri-lock-password-line"></i>
                        <input type="password" id="confirm-password"
                               placeholder="Enter your password again"
                               autocomplete="new-password"
                               minlength="8" required>

                        <button type="button" class="password-toggle"
                                aria-label="Show password"
                                data-target="confirm-password">
                            <i class="ri-eye-line"></i>
                        </button>
                    </div>
                </div>

                <p id="register-message" class="auth-message"
                   role="status" aria-live="polite"></p>

                <button type="submit" class="auth-submit">
                    Create Account <i class="ri-arrow-right-line"></i>
                </button>

            </form>

            <div class="auth-divider">
                <span>OR</span>
            </div>

            <p class="auth-switch">
                Already have an account?
                <a href="login.html">Login</a>
            </p>

        </div>

        <p class="auth-footer">
            © 2026 HyperSwirl. All rights reserved.
        </p>

    </div>

    <script src="java.js"></script>
</body>
</html>
