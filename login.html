<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <link rel="icon" type="image/png" href="logo.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | HyperSwirl</title>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/remixicon/4.6.0/remixicon.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="auth-page">
    <div class="auth-top">
        <a href="index.html" class="auth-logo">
            <img src="logo.png" alt="HyperSwirl Logo">
            <span>Hyper<span>Swirl</span></span>
        </a>

        <button class="action-btn" id="theme-toggle" type="button" aria-label="Switch to dark mode" title="Toggle light and dark mode">
            <i class="ri-moon-line" id="theme-icon" aria-hidden="true"></i>
          </button>
    </div>

    <div class="auth-container">

        <div class="auth-card">

            <a href="index.html" class="back-home">
                <i class="ri-arrow-left-line"></i> Back to Home
            </a>

            <div class="auth-heading">
                <div class="auth-icon">
                    <i class="ri-shield-user-line"></i>
                </div>

                <span class="auth-label">WELCOME BACK</span>

                <h1>Login to your account.</h1>

                <p>
                    Access your HyperSwirl account and stay informed
                    about tropical cyclones.
                </p>
            </div>

            <form id="login-form">

                <div class="auth-group">
                    <label for="login-email">Email Address</label>

                    <div class="auth-input">
                        <i class="ri-mail-line"></i>
                        <input type="email" id="login-email"
                               placeholder="Enter your email"
                               autocomplete="email" required>
                    </div>
                </div>

                <div class="auth-group">
                    <label for="login-password">Password</label>

                    <div class="auth-input">
                        <i class="ri-lock-line"></i>
                        <input type="password" id="login-password"
                               placeholder="Enter your password"
                               autocomplete="current-password" required>

                        <button type="button" class="password-toggle"
                                aria-label="Show password"
                                data-target="login-password">
                            <i class="ri-eye-line"></i>
                        </button>
                    </div>
                </div>

                <p id="login-message" class="auth-message"
                   role="status" aria-live="polite"></p>

                <button type="submit" class="auth-submit">
                    Login <i class="ri-arrow-right-line"></i>
                </button>

            </form>

            <div class="auth-divider">
                <span>OR</span>
            </div>

            <p class="auth-switch">
                Don't have an account?
                <a href="register.html">Create an account</a>
            </p>

        </div>

        <p class="auth-footer">
            © 2026 HyperSwirl. All rights reserved.
        </p>
    </div>

    <script src="java.js"></script>
</body>
</html>
